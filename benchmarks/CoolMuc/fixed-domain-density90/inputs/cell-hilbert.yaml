# This yaml file simulates a homogenous set of particles in a fixed occupied domain.
container                        :  [VerletListsReferences]
verlet-rebuild-frequency         :  10
verlet-skin-radius               :  1.0
verlet-cluster-size              :  4
selector-strategy                :  Fastest-Absolute-Value
data-layout                      :  [AoS] # using AoS effects the iteration over particles in base Verlet List implementation
traversal                        :  [vl_list_iteration] # Please see AllOptions.yaml for a comprehensive list of traversals
tuning-strategies                :  []
tuning-interval                  :  2500
tuning-samples                   :  3
tuning-max-evidence              :  10
functor                          :  Lennard-Jones AVX
newton3                          :  [disabled]

verlet-particle-sorting-enabled   :  true
verlet-particle-sorting-resolution:  cell
verlet-particle-sorting-order     :  hilbert
verlet-particle-sorting-block-size: [4, 4, 4]

cutoff                           :  3
cell-size                        :  [1]
deltaT                           :  0.0005
iterations                       :  50 # benchmark run
energy-sensor                    :  likwid
boundary-type                    :  [reflective,reflective,reflective]
globalForce                      :  [0,0,0] # No gravity in this simulation
Sites:
  0:
    epsilon                      :  1.
    sigma                        :  1.
    mass                         :  1.
# Fixed-domain density sweep:
# The occupied side length is kept at 82.8, matching the 70^3 reference case:
#   (70 - 1) * 1.2 = 82.8
# For each dimension N, the spacing is set to:
#   particle-spacing = 82.8 / (N - 1)
Objects:
  CubeGrid:
    0:
      particles-per-dimension: [90, 90, 90] # 729000 particles, fixed occupied side length 82.8
      particle-spacing: 0.930337
      bottomLeftCorner: [0, 0, 0]
      velocity: [0, 0, 0]
      particle-type-id: 0
#vtk-filename                     :  homogenousCubeGrid
#vtk-write-frequency              :  10
#vtk-output-folder                :  vtkOutputFolder
no-end-config                    :  true
log-level                        :  info
