# This yaml file simulates a homogenous set of particles
container                        :  [VerletListsReferences]
verlet-rebuild-frequency         :  10
verlet-skin-radius               :  1.0
verlet-cluster-size              :  4
selector-strategy                :  Fastest-Absolute-Value
data-layout                      :  [SoA] # using AoS effects the iteration over particles in base Verlet List implementation
traversal                        :  [vl_list_iteration] # Please see AllOptions.yaml for a comprehensive list of traversals
tuning-strategies                :  []
tuning-interval                  :  2500
tuning-samples                   :  3
tuning-max-evidence              :  10
functor                          :  Lennard-Jones AVX
newton3                          :  [disabled]

verlet-particle-sorting-enabled   :  true
verlet-neighbor-list-sorting-enabled: false
verlet-particle-sorting-resolution:  block
verlet-particle-sorting-order     :  hilbert
verlet-particle-sorting-block-size: [4, 4, 4]

cutoff                           :  3
cell-size                        :  [1]
deltaT                           :  0.0005
iterations                       :  50 # For sanity check only small amount of iterations suffices
energy-sensor                    :  likwid
boundary-type                    :  [reflective,reflective,reflective]
globalForce                      :  [0,0,0] # No gravity in this simulation
Sites:
  0:
    epsilon                      :  1.
    sigma                        :  1.
    mass                         :  1.
# Uncomment below to run a multi-site simulation.
#Molecules:
#  0:
#    site-types                   :  [ 0 ]
#    relative-site-positions      :  [ [0, 0, 0 ] ]
#    moment-of-inertia            :  [ 1., 1., 1. ]
Objects:
  CubeGrid: # follows deterministic regular grid and allows exact particle count. Most stable homogenous version.
    0:
      particles-per-dimension: [70, 70, 70] # 343000 particles
      particle-spacing: 1.2
      bottomLeftCorner: [0, 0, 0]
      velocity: [0, 0, 0]
      particle-type-id: 0
# thermostat:
#   initialTemperature             :  1
#   targetTemperature              :  4
#   deltaTemperature               :  0.1
#   thermostatInterval             :  10
#   addBrownianMotion              :  false
#vtk-filename                     :  homogenousCubeGrid  #comment out this and next 2 lines to turn of vtk
#vtk-write-frequency              :  10
#vtk-output-folder                :  vtkOutputFolder
no-end-config                    :  true
log-level                        :  info    # log level info will have minimal effect on benchmarking